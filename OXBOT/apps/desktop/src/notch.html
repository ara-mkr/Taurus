<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Taurus in the notch (November 6, 2026). Draws only what the main process hands it; no network, no frames. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Taurus</title>
<style>
  :root { --nw: 196px; --nh: 33px; --drop: 0px; --wing: 44px; --open-w: 520px; --ink: #F4F3EE; --ink-2: #A9A8A1; --ink-3: #8A8983; --line: rgba(255, 255, 255, .1); --red: #FF5A4F;
    --spring: cubic-bezier(.32, 1.25, .5, 1); color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  button, input { font: inherit; color: inherit; }

  /* The pill: black like the camera housing, hugging the top edge, with the small inward curves where it meets it. */
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: calc(var(--nw) + var(--wing) * 2); height: var(--nh);
    background: #000; border-radius: 0 0 calc(var(--nh) * .42) calc(var(--nh) * .42);
    transition: top .42s var(--spring), width .42s var(--spring), height .42s var(--spring), border-radius .42s var(--spring), box-shadow .3s ease; }
  .notch::before, .notch::after { content: ""; position: absolute; top: 0; width: 10px; height: 10px; pointer-events: none; }
  .notch::before { right: 100%; background: radial-gradient(circle at 0 100%, transparent 9.5px, #000 10px); }
  .notch::after { left: 100%; background: radial-gradient(circle at 100% 100%, transparent 9.5px, #000 10px); }
  /* On a screen without a notch it can be a pill (Settings > Notch). Closed, a capsule, as far from the top as set;
     open, it attaches flush to the top like the notch: flat along the top edge, only the bottom corners rounded
     (owner, November 19, 2026: "the edge hitting the top is flat and flush theres no curve there only fileted bottom
     sides"). */
  .notch[data-shape="pill"] { top: var(--drop); border-radius: calc(var(--nh) / 2); }
  .notch[data-shape="pill"]::before, .notch[data-shape="pill"]::after { display: none; }
  .notch[data-open="true"], .notch[data-shape="pill"][data-open="true"] { top: 0; width: var(--open-w); height: var(--open-h, 260px); border-radius: 0 0 30px 30px; box-shadow: 0 22px 60px -18px rgba(0, 0, 0, .7); }

  /* The strip beside the camera: Taurus on one side, what he is doing on the other. */
  .bar { position: absolute; top: 0; left: 0; right: 0; height: var(--nh); display: grid; grid-template-columns: minmax(0, 1fr) var(--nw) minmax(0, 1fr); align-items: center; }
  .notch[data-open="true"] .bar { padding: 0 20px; }
  .wing { display: flex; align-items: center; min-width: 0; height: 100%; overflow: hidden; white-space: nowrap; }
  .wing.left { justify-content: flex-start; padding-left: 13px; }
  .wing.right { justify-content: flex-end; padding-right: 13px; }
  .notch[data-open="true"] .wing { padding: 0; }
  .status { font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .status.live { color: var(--ink); }

  .taurus { display: block; height: 15px; width: auto; color: #FFF; transition: height .42s var(--spring); }
  .notch[data-open="true"] .taurus { height: 20px; }
  .taurus .eye { transform-box: fill-box; transform-origin: 50% 50%; }
  .notch[data-phase="listening"] .taurus .eye { animation: hear 1.1s ease-in-out infinite; }
  .notch[data-phase="thinking"] .taurus { animation: think 1.4s ease-in-out infinite; }
  @keyframes hear { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
  @keyframes think { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  /* The open panel. */
  .panel { position: absolute; top: var(--nh); left: 0; right: 0; padding: 14px 22px 18px; display: grid; gap: 14px; opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .18s ease, transform .3s var(--spring), visibility 0s linear .18s; }
  .notch[data-open="true"] .panel { opacity: 1; visibility: visible; transform: none; transition: opacity .22s ease .08s, transform .38s var(--spring) .04s; }
  .main > div:empty { display: none; }
  .said { margin: 0; color: var(--ink-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .answer { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 500; max-height: 6.8em; overflow: auto; scrollbar-width: none; user-select: text; }
  .answer.quiet { color: var(--ink-2); font-weight: 400; font-size: 15px; }
  .answer.news { white-space: pre-line; }
  .answer.problem { color: var(--red); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 30px; padding-top: 12px; border-top: 1px solid var(--line); }
  .row .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .what b { font-weight: 600; }
  .row .what span { color: var(--ink-2); }
  .row .time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .word { padding: 4px 10px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, .1); font-size: 13px; font-weight: 600; cursor: pointer; }
  .word:hover { background: rgba(255, 255, 255, .18); }
  .word:focus-visible, .ask input:focus-visible, .seg button:focus-visible, .link:focus-visible { outline: 2px solid #FFF; outline-offset: 2px; }
  .ask { display: flex; gap: 8px; margin: 0; }
  .ask input { flex: 1; min-width: 0; height: 38px; padding: 0 14px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .1); font-size: 15px; outline: none; user-select: text; }
  .ask input::placeholder { color: var(--ink-3); }
  .foot { display: flex; justify-content: space-between; gap: 12px; }
  .link { padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .link:hover { color: var(--ink); }

  /* Settings, inside the same panel. */
  .settings { display: grid; gap: 2px; max-height: 340px; overflow: auto; scrollbar-width: none; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 36px; border-top: 1px solid var(--line); font-size: 14px; }
  .group + .setting { border-top: 0; }
  .seg { display: inline-flex; flex: none; gap: 2px; padding: 2px; border-radius: 10px; background: rgba(255, 255, 255, .08); }
  .seg button { padding: 3px 9px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .2); color: #FFF; }
  .setting input[type="range"] { width: 150px; accent-color: #FFF; }
  .group { margin: 12px 0 2px; color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .group:first-child { margin-top: 0; }

  @media (prefers-reduced-motion: reduce) {
    .notch, .taurus, .panel { transition: opacity .15s ease !important; }
    .notch[data-phase] .taurus, .notch[data-phase] .taurus .eye { animation: none !important; }
  }
</style>
</head>
<body>
<div class="notch" id="notch" data-open="false" data-phase="idle" role="region" aria-label="Taurus">
  <div class="bar"><div class="wing left" id="left"></div><div></div><div class="wing right" id="right"></div></div>
  <div class="panel" id="panel"></div>
</div>
<script src="notch-view.js"></script>
</body>
</html>
