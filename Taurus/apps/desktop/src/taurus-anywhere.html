<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Taurus anywhere (November 16, 2026; docs/21-taurus-anywhere.md). Draws only: no network, nothing but this page's own
     script. Clicks fall through the whole window. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Taurus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #F2F1EC; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; }
  /* Taurus sits at the bottom right of the screen; his words open above him, from his corner. */
  #runner { position: absolute; right: 22px; bottom: 16px; width: 124px; opacity: 0; will-change: transform, opacity; }
  /* Light ink with a dark edge reads over light and dark apps alike, with no tile behind him. */
  #runner .taurus { display: block; width: 100%; height: auto; overflow: visible; color: #F4F3EE;
    filter: drop-shadow(0 0 1.2px rgba(0, 0, 0, .95)) drop-shadow(0 0 5px rgba(0, 0, 0, .35)) drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
  #bubble { position: absolute; right: 18px; bottom: 124px; box-sizing: border-box; width: max-content; max-width: 380px; max-height: 232px; overflow: hidden;
    padding: 12px 15px; border-radius: 16px; background: rgba(18, 19, 23, .92);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 0 1px rgba(255, 255, 255, .1), 0 24px 48px -20px rgba(0, 0, 0, .7);
    opacity: 0; transform: translateY(6px) scale(.97); transform-origin: 85% 100%;
    transition: opacity .14s ease-out, transform .14s ease-out; }
  #bubble.in { opacity: 1; transform: none; transition-duration: .22s; transition-timing-function: cubic-bezier(.23, 1, .32, 1); }
  #bubble[data-muted="true"] { color: #B4B3AC; }
  #bubble span { display: inline; animation: word .22s cubic-bezier(.23, 1, .32, 1) both; }
  @keyframes word { from { opacity: 0; filter: blur(2px); } }
  @media (prefers-reduced-motion: reduce) { #bubble { transition: opacity .2s ease; transform: none; } #bubble span { animation: none; } }
</style>
</head>
<body data-state="out">
<div id="bubble" role="status" aria-live="polite"></div>
<div id="runner"></div>
<script src="taurus-anywhere.js"></script>
</body>
</html>
