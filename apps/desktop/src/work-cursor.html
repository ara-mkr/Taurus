<html lang="en"><head><meta charset="utf-8">

<title>Taurus working</title>
<style>
html,body{margin:0;overflow:hidden;background:transparent;font:500 13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none}
#cursor{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;filter:drop-shadow(0 2px 4px #0009)}

</style></head><body>
<div id="cursor" role="status" aria-live="polite"><svg viewBox="0 0 27 32" aria-hidden="true"><path d="M3 2L23 17L14 19L10 28Z"/></svg><span id="label"><b id="name">Taurus</b><span id="status"></span></span></div>
